name: fetch-media

on:
  workflow_dispatch:
  push:
    paths:
      - "media/manifest.json"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Fetch media from manifest
        run: python3 tools/fetch_media.py
      - name: Commit results
        run: |
          git config user.name "media-bot"
          git config user.email "media-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: fetch media assets [skip ci]"
          git push
